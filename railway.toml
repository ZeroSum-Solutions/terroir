# BND-035 — Railway service config.
#
# Railway uses Railpack (its current build system) to auto-detect Node and pnpm.
# railpack.json installs Debian Chromium in both the build and final images and
# selects /usr/bin/chromium for Puppeteer. The build verifies that executable.
#
# Healthcheck points at the no-auth /api/health endpoint so Railway
# can distinguish "process is alive and serving" from "zombie".

[deploy]
buildCommand = "pnpm validate:worker-browser && pnpm validate:env && pnpm build"
startCommand = "pnpm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
