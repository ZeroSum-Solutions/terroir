change_contract:
  touched_surfaces: Exact API route handlers, shared request schemas and business helpers, authorization and abuse-control manifests, idempotency implementation ledger, source inventory, and reconciliation evidence.
  invariants: Authentication precedes parameter or body parsing; capabilities are enforced at the route decision point; every lookup and mutation is active-tenant scoped; invalid input reaches no business dependency; provider failures remain redacted; keyed retries replay without a second business effect.
  data_effects: No schema or migration change. Successful restaurant, invitation, and membership commands retain the existing table or RPC effects of their alternate routes.
  rollback: Revert the TER-020E commits; no database rollback is required.
verification:
  red_green: Each exact handler first failed because its method export or route module did not exist, then passed after the corresponding vertical implementation.
  focused: Eleven route, authorization, idempotency, and inventory files passed 113 tests before replay-boundary strengthening; the final exact-handler replay set also passed.
  contracts: pnpm run test:contracts passed 16 files and 139 tests.
  full: pnpm test passed 176 files and 1665 tests; TypeScript no-emit, lint, and the Next.js production build passed on Node 24.16.0 with pnpm 10.33.2.
  inventories: API contract passed with 92 implemented operations, zero planned promises, and 92 classifications; feature ledger passed with 269 requirements; UI controls passed across 23 routes and 345 controls.
  migrations: Snapshot check passed with 82 migrations and 440577 bytes; all 72 forward migrations from 0011 have rollback pairs. No TER-020E migration was needed.
security:
  authorization: GET wine uses wine:view; GET scan uses scan:create; restaurant mutation uses restaurant:manage; invitation uses team:invite-manage; membership removal uses team:member-manage.
  tenancy: Reads filter by resource ID and active restaurant. Writes derive the restaurant from the active membership, and the membership-removal RPC independently scopes the target to that restaurant.
  validation: Dynamic IDs are UUID-validated and normalized; strict shared Zod schemas reject malformed restaurant and invitation bodies before database work.
  idempotency: The three exact writes use distinct operation IDs and canonical normalized hashes; exact replay tests prove no second update, insert, or removal call.
staging:
