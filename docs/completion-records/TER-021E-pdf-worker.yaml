spec_id: TER-021E
parent_spec: TER-021
base_commit: 8d895fb5f7b73fbbbc063a9e196b3275b980dba2
status: staging_validated_production_pending
scope: Worker-backed wine-list PDF generation behind a default-safe rollback flag, with durable enqueue identity and private bounded artifacts.
requirements_implemented:
  - Missing or non-literal PDF_WORKER_ENABLED values preserve the existing synchronous PDF response.
  - Enabled generation requires a valid caller-owned Idempotency-Key and returns the durable wine_list_pdf job reference within the request.
  - The worker validates tenant, subject table, subject ID, and allowlisted template before rendering.
  - Duplicate delivery upserts one canonical private object per restaurant, list, and template.
  - Completed downloads re-check membership, tenant, job type, subject, result shape, and exact artifact path.
  - Disabling new enqueues does not strand queued jobs or prevent completed artifact retrieval.
database:
  forward: supabase/migrations/0077_wine_list_pdf_artifacts.sql
  rollback: supabase/migrations/down/0077_wine_list_pdf_artifacts.down.sql
  acceptance: supabase/tests/0077_wine_list_pdf_artifacts.sql
  bucket: generated-exports
  retention: Latest snapshot per list/template until replacement or tenant deletion.
security:
  authorization: Existing requireMembership gate plus explicit restaurant filters and private Storage RLS.
  untrusted_input: Allowlisted generation and job metadata schemas, canonical UUID/template path validation, and exact path equality before Storage read.
  export: Authenticated application response only; no public or signed export URL is stored or logged.
  secrets: The service-role key remains isolated to the worker process and is never returned in health, job result, or telemetry.
rollback: Set PDF_WORKER_ENABLED=0 on the web service, allow queued and active PDF jobs to drain with the handler deployed, then roll back the worker if required.
verification:
  focused: Route, enqueue service, PDF boundary, worker handler, rollback flag, synchronous fallback, privacy, browser-gate, and workflow-contract tests passed.
  full: 165 files and 1606 tests passed; lint and production-build gates passed on Node 24.16.0 with pnpm 10.33.2.
  browser_collection: GitHub Actions run 31232010892 passed exact-SHA staging smoke, both isolated authenticated E2E slots, the single-slot browser download, and the 10-request worker load pilot; encrypted browser evidence was retained.
  linux_browser_gate: Railway worker build c9e0b052-2f72-4d53-a00e-6e251936140e launched Puppeteer against /usr/bin/chromium, rendered the local readiness title, and closed successfully.
  independent_review: x-ai/grok-4.5 returned PASS on the exact 8d895fb5f7b73fbbbc063a9e196b3275b980dba2 workflow, browser test, validator, Railpack, and service manifests.
staging_evidence:
  exact_candidate: 8d895fb5f7b73fbbbc063a9e196b3275b980dba2
  web_deployment: 45034ec8-faf4-43a9-acc4-0e8fb5c39451
  worker_deployment: c9e0b052-2f72-4d53-a00e-6e251936140e
  github_run: 31232010892
  authenticated_boundaries: Same-tenant enqueue and download passed, replay returned one durable job, cross-tenant job and artifact access returned 404, and the private artifact began with %PDF.
  load: Ten distinct jobs drained successfully into one canonical artifact; the worker returned to queue depth zero with zero dead letters.
  lease_recovery: A job claimed by a stopped synthetic replica expired its lease, was recovered by the replacement worker, and succeeded on attempt two with one canonical artifact.
  dead_letter: A bounded staging storage fault produced the 30-second and 60-second retries, terminal dead-letter state, and action-required alert; after storage restoration the same job requeued and succeeded.
  rollback: With PDF_WORKER_ENABLED=0, an authenticated request returned the synchronous application/pdf response with no durable job; staging was then restored to worker mode.
staging_evidence_required: []
production_evidence_required:
  - Promote only through TER-046 after the final integrated candidate passes its complete release gate and production canaries.
deployment: Staging web and worker serve exact commit 8d895fb5f7b73fbbbc063a9e196b3275b980dba2. Production remains unchanged on the previously restored release.
