known_limits:
  - The default Playwright headless-shell install was unavailable; the negative browser test passed with the installed system Chrome against anonymous localhost, while the real-provider suite remained safely skipped.
  - Live production type generation reports expected drift because production does not yet include the broader branch's pending migrations; the generated file was restored and TER-011 changes no schema.
  - Code removal alone does not prove mutable deployment variables or the prior token are revoked; the operator checklist is a mandatory release step.
data_change:
  migration: none
  backup_verified: not-applicable
rollback: Revert 33b81a8dc373fa873321405158375791ee9c0554 to restore the prior code, but do not restore retired deployment variables or tokens.
