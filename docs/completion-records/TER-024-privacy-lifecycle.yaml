scope: Private tenant-scoped invoice and wine-image Storage, destructive deletion propagation, user-attribution lifecycle, and a redacted operating data map.
base: f9a19fdcbd3613f19ce63307c8c029b7981bd063
implementation:
  migration: supabase/migrations/0075_privacy_storage_lifecycle.sql
  bucket_provisioning: supabase/migrations/0076_private_media_bucket_provisioning.sql
  rollback: supabase/migrations/down/0075_privacy_storage_lifecycle.down.sql
  bucket_provisioning_rollback: supabase/migrations/down/0076_private_media_bucket_provisioning.down.sql
  routes:
    - DELETE /api/restaurant/[id] removes tenant Storage prefixes before the atomic database deletion.
    - DELETE /api/cellar/[id] retries wine-image cleanup after a successful atomic wine deletion.
  controls:
    - Both image buckets are private and application signed URLs last five minutes.
    - New object writes require an exact tenant/resource path and existing tenant-scoped objects remain removable during cleanup.
    - Auth-user deletion cascades short-lived control records and nulls restaurant-owned attribution fields.
    - Scanner and image-storage error logging does not interpolate provider error objects.
verification:
  source_contract: src/test/contracts/privacy-lifecycle.test.ts
  sql_acceptance: supabase/tests/0075_privacy_storage_lifecycle.sql
  runbook: docs/runbooks/data-lifecycle-privacy.md
  required_local_gates:
    - pnpm test -- src/test/contracts/privacy-lifecycle.test.ts
    - pnpm test -- src/app/api/restaurant/[id]/route.test.ts src/app/api/cellar/[id]/route.test.ts src/app/api/wines/[id]/image/route.test.ts src/app/api/scans/[id]/image/route.test.ts
    - pnpm snapshot:check
    - pnpm downs:check
  staging_observed_at: 2026-08-07T18:22:39Z
  staging_project: wwhxcgtcecsftcivosop
  staging_results:
    - 0075 applied; the first acceptance run correctly failed because invoice-images was absent.
    - 0076 provisioned both private buckets; the corrected SQL acceptance transaction passed.
    - Same-tenant signed reads passed for invoice and wine images.
    - Cross-tenant signed read and write attempts were denied for both governed prefixes.
    - Cross-tenant deletion left both objects readable to their owner; owner deletion then removed both.
    - Deleting a synthetic Auth user removed membership and nulled retained wine attribution.
staging_evidence_required:
  - Exercise a synthetic owner restaurant deletion and verify both Storage prefixes are empty before recording only counts and timestamps.
  - Confirm current Azure, Anthropic, Railway, and Sentry retention settings with the account owners; no provider setting was inspected or changed by this change.
  - Confirm the Auth-user deletion procedure on a synthetic user after transferring or deleting every owned restaurant.
deployment: 0075 and 0076 are applied to isolated staging only; application code is not yet deployed and production was not changed.
