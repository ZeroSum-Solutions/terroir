spec_id: TER-023
implementation_commit: eaba9a4
status: source_complete_runtime_evidence_pending
scope: Centralized fail-fast configuration, truthful public readiness, privacy-safe telemetry, exact-destination non-production alert drill, and incident response policy.
tests:
  focused: Runtime schema, health/drill guard, drill CLI destination safety, structured telemetry, Sentry scrubbing/replay privacy, and sample-rate parsing.
  full: pnpm test; pnpm test:contracts; pnpm exec tsc --noEmit; pnpm lint; pnpm build.
  inventories: pnpm verify:api-contract; pnpm verify:feature-ledger; pnpm verify:ui-controls.
  migrations: pnpm snapshot:check; pnpm downs:check; no migration added or edited.
deployment:
  executed: false
  configuration_gate: Railway build and application start both run the same names-only Zod validation.
  local_alert_drill: passed against a local Next server; response and structured event contained the required redacted envelope.
  staging_alert_delivery: pending deployment, alert-rule configuration, delivered-notification evidence, and dashboard screenshot.
security:
  public_health: HTTP 200 liveness remains stable; readiness and dependency states are names-only and no billed provider is called.
  drill: Requires a 32-to-256-character token digest plus explicit staging enablement; production refuses it and the CLI exports only to localhost or the exact Terroir staging origin.
  logging: Free text, PII, request data, credentials, invoice/OCR content, frame locals, replay text/inputs/media, and replay network bodies are suppressed.
  export_policy: Only Railway project logs, the configured Terroir Sentry project, and the exact Terroir staging drill endpoint are allowlisted.
evidence:
  - Missing or malformed required values fail before build/start traffic without printing values.
  - Optional integrations are configured or degraded; unavailable email, worker, and storage probes are never reported healthy.
  - Auth failures, scan latency/errors, list generation, and reconciliation emit bounded metric events with opaque correlation IDs.
  - Alert thresholds, payload fields, destination policy, drill procedure, and incident triage are documented in docs/operations/observability.md.
known_limits:
  - TER-023 acceptance is not complete until one deployed staging failure delivers the configured alert and the redacted dashboard and notification evidence are recorded.
  - The repository has no worker or email-delivery producer, so those states remain not_configured and no fabricated metrics are emitted.
  - Storage remains unknown while the database is reachable because there is no independent non-billed storage probe.
rollback: Revert eaba9a4, d0894bb, bc03709, 1907361, and 873bbc9 in reverse order.
