verification:
  red_green: The isolated Supabase database first reproduced an inventory row with quantity 1, unit cost 0, the requested location, and added_via manual; migration 0082 changed only that atomic RPC insertion to bottle_scan, after which the same transactional acceptance passed.
  focused: Six bottle-scan route, boundary, component, and contract files passed with 61 tests; the strengthened follow-up set passed four files and 32 tests.
  database: Migrations through 0080 plus 0082 applied in isolated Supabase PostgreSQL; keyed fresh and exact replay created one bottle_scan inventory row, and the 0082 down migration restored the byte-identical 0066 function before a successful reapply.
  static: TypeScript no-emit, focused lint, schema snapshot generation, the 71-pair down-migration gate, and one-test Playwright collection passed on Node 24.16.0 with pnpm 10.33.2.
  browser: The isolated mobile test is collected but has not yet executed against staging; browser runtime evidence is unavailable and is not recorded as a pass.
  independent_review: Fable 5 at medium reasoning returned PASS after the exact contiguous RPC source and corrective follow-up were reviewed; no P0, P1, or P2 finding remained.
security:
  route: Existing membership enforcement and request schemas reject unauthenticated, malformed, and foreign-tenant lookup or confirmation requests before a write is exposed.
  database: The security-definer RPC derives auth.uid, independently checks current-tenant staff membership and tenant-owned wine, binds keyed claims to the caller and request hash, and grants execute only to authenticated users.
  idempotency: Fresh keyed confirmation and exact replay return the same stored status, body, and execution start while creating one row.
  data_lifecycle: Isolated fixture teardown deletes availability events, inventory items, and wines for every fixture restaurant before deleting the tenant graph.
staging_evidence_required:
  - Apply migration 0082 to the isolated staging branch after dependency migration 0081 is integrated.
  - Execute e2e/bottle-scan.test.ts at the mobile viewport and retain its trace, network, console, and database assertions.
  - Confirm malformed lookup and foreign lookup or confirmation create no bottle_scan rows, correction persists the corrected wine, and two distinct rapid scans create exactly two rows.
dependency_evidence_required:
  - Close the five planned TER-020 exact-path handlers before marking TER-028 complete.
production_evidence_required:
  - Promote only through TER-046 after the final integrated candidate passes its complete release gate and production canaries.
