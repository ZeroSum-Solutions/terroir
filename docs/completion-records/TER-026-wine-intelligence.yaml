verification:
  focused: Six Vitest files and 101 tests passed across deterministic calculations, enrichment, single-wine re-enrichment, LWIN fallback, mutation boundaries, and manual-field preservation.
  full: The second full run passed 171 Vitest files and 1635 tests; TypeScript, lint, and the production build passed on Node 24.16.0 with pnpm 10.33.2. The first full run observed one unrelated team-action timing failure that immediately passed in isolation and in the second full run.
  inventories: API contract passed with 87 implemented operations, 5 planned operations, and all 87 classified; feature ledger passed with 269 requirements; UI controls passed across 23 routes and 345 controls.
  migrations: The source checkpoint produced 81 migrations and a 431580-byte snapshot. Integrated follow-up reproduced the fresh-CLI ACL failure, added explicit minimum SELECT and UPDATE wine privileges governed by RLS, and then passed both 0081 and 0082 transactional acceptance, restricted privilege-matrix checks, down migrations, and ordered reapply; the integrated snapshot contains 82 migrations and 440577 bytes.
  browser: The exact 08d3145 staging run 31243072440 passed both isolated wine-intelligence tests on one Chrome worker in 26.3 seconds. It proved owner guidance, deterministic enrichment, atomic manual drink-window preservation after re-enrichment, staff UI and API denial, and cross-tenant 404 behavior; successful traces plus console, network, and database attachments were encrypted and retained in artifact 9017663089 through 2026-08-22.
  independent_review: The first exact-ref verifier returned REWORK for a staff database bypass and two stale evidence paths. Both were corrected test-first; the source verifier returned PASS at aa0eb57, and the exact integrated verifier returned PASS at f0c9348 with no P0, P1, or P2 source finding.
security:
  route: PATCH metadata and POST re-enrichment authenticate the caller and require owner or manager before tenant-bound work.
  database: Security-definer metadata and enrichment RPCs repeat authentication and manager-role checks, bind every wine row to the requested tenant, and expose execute only to authenticated callers. Wine UPDATE RLS independently requires owner or manager, preventing direct staff mutation of intelligence or manual-lock fields.
  input: HTTP schemas and SQL validation reject unsupported keys, non-integral years, out-of-range years, oversized or untrimmed strings, and inconsistent drink-window results.
  privacy: Cross-tenant metadata writes and re-enrichment return no foreign wine data; staff cannot invoke or see re-enrichment controls.
