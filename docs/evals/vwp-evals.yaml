  # source: PRD VWP-FR-026; spike 9 (2026-08-25-spike-09-voice-retrieval-eval.md,
  # producer-corroboration/margin + false-accept findings); spike 1
  # (2026-08-25-spike-01-stt-vendor-eval.md, accent-folding + empty-transcript +
  # keyterm-capacity findings)
  - id: SPEC-21
    name: voice-retrieval eval
    branch: feat/vwp-21-voice-retrieval-eval
    e2e_tag: "@vwp-21"
    depends_on: [SPEC-20]
    # depends_on rationale: SPEC-21 scores the tool SPEC-20 builds (spec-list SPEC-21:
    #   "Scored utterance set -> expected tool calls + result sets") — inferred from that
    #   evaluation relationship, not a literal spec-list "Gated by:" line.
    evals:
      - id: EV-VWP-21.1
        then: >-
          the eval's resolver rejects a bare similarity-threshold accept and only
          resolves a match when producer-token corroboration or a top-1/top-2 margin
          rule passes; a case reproducing spike 9's Biondi-Santi query (baseline
          false-accepted Fanti Brunello at 0.53) must reject rather than accept
      - id: EV-VWP-21.2
        then: >-
          the eval report's out-of-inventory false-accept rate is computed over the
          out-of-inventory query subset alone, denominated separately from
          in-inventory resolution accuracy, and gated at thresholds the owner
          confirms before tickets freeze
      - id: EV-VWP-21.3
        then: >-
          the eval report includes an empty-transcript rate as its own gated metric,
          computed separately from resolution accuracy, exercised by the fixture's
          garbage/empty-input cases
      - id: EV-VWP-21.4
        then: >-
          the scored case set exercises wine resolution, location resolution,
          ambiguity, out-of-domain/unanswerable questions, and abstention, each passing
          its own pre-registered threshold; separately, demo-rehearsal mode's readiness
          guard refuses to enable unless (a) a current voice-retrieval eval report file
          exists, (b) its timestamp is newer than the retrieval resolver's last
          build/deploy, and (c) every gated metric in that report reads GO — rehearsing
          a retrieval demo line while any of (a)-(c) fails is blocked (VWP-FR-026; PRD
          criterion 10)
      - id: EV-VWP-21.5
        then: >-
          an accented query (e.g. "côte-rôtie") is folded to ASCII before resolution;
          an eval case asserts the folded form clears match_lwin's 0.3 similarity
          threshold where the unfolded form (measured 0.294) would not
      - id: EV-VWP-21.6
        then: >-
          the eval's tenant keyterm hot-list fixture stays within vendor-observed
          capacity — at most 75 phrases / 124 words for a Deepgram-configured run
          (spike 1's measured ceiling); 93 phrases / 156 words observed accepted for an
          AssemblyAI-configured run (documented cap 1,000 words, not probed to
          failure) — never a full-catalog list (spike 1 keyterm capacity findings)
      - id: EV-VWP-21.7
        then: >-
          the eval report states uncertainty at the utterance-cluster level — repeated
          renditions/configs of one utterance are never treated as independent samples;
          the per-metric interval or permutation p-value is computed over utterance
          clusters, matching the spike-1 statistics discipline that the audit made
          binding (spike 1 §Statistics: utterance-clustered permutation)
      - id: EV-VWP-21.8
        then: >-
          the eval exercises the hot-list selection contract end-to-end: the keyterm
          list used by a scored run is produced by the SPEC-19 selection source and
          refresh cadence under test (by-the-glass/recent-scan/velocity per the
          configured policy), and the report names which selection policy produced it —
          a hand-curated list voids the run (spike 1 consequence 1; SPEC-19 hot-list
          contract)

