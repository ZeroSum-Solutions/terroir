name: DB Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Latest completed main DB Backup workflow run to restore
        required: true
        type: string
      candidate_sha:
        description: Exact current staging SHA this restore proof authorizes
        required: true
        type: string
      confirmation:
        description: Type RESTORE-TRUSTED-BACKUP to authorize the recovery drill
        required: true
        type: string

concurrency:
  group: db-restore-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    name: Restore into disposable Supabase
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: database-recovery
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Require the configured recovery owner
        env:
          ACTOR: ${{ github.actor }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RECOVERY_OWNER: ${{ vars.PRODUCTION_RELEASE_OWNER }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$RECOVERY_OWNER"
          test "$ACTOR" = "$RECOVERY_OWNER"
          test "$CONFIRMATION" = "RESTORE-TRUSTED-BACKUP"

      - name: Checkout trusted restore implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0

      - name: Require main and the exact staging candidate
        env:
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin staging
          test "$CANDIDATE_SHA" = "$(git rev-parse origin/staging)"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.112.0

      - name: Install PostgreSQL 17 and age
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/postgresql-pgdg.asc"
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            tee "$key_file" > /dev/null
          fingerprint="$(
            gpg --show-keys --with-colons "$key_file" |
              awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [ "$fingerprint" != "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8" ]; then
            echo "::error::Unexpected PostgreSQL repository signing key."
            exit 1
          fi
          sudo gpg --dearmor \
            --output /usr/share/keyrings/postgresql-pgdg.gpg \
            "$key_file"
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/postgresql-pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 age
          pg_bin="/usr/lib/postgresql/17/bin"
          test -x "$pg_bin/pg_restore"
          echo "$pg_bin" >> "$GITHUB_PATH"

      - name: Run authenticated disposable restore
        env:
          BACKUP_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          GH_TOKEN: ${{ github.token }}
          RESTORE_DRILL_AGE_IDENTITY: ${{ secrets.RESTORE_DRILL_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$RESTORE_DRILL_AGE_IDENTITY"
          export BACKUP_PROOF_DIR="$HOME/Inbox/notes/terroir-backup-drills/workflow-$GITHUB_RUN_ID"
          scripts/backup/run-restore-drill.sh
          upload_dir="$RUNNER_TEMP/db-restore-proof"
          mkdir -m 700 "$upload_dir"
          cp \
            "$BACKUP_PROOF_DIR/release-proof.json" \
            "$BACKUP_PROOF_DIR/restore-report.json" \
            "$BACKUP_PROOF_DIR/restore-method.json" \
            "$BACKUP_PROOF_DIR/github-run.json" \
            "$BACKUP_PROOF_DIR/github-artifacts.json" \
            "$BACKUP_PROOF_DIR"/*.manifest.json \
            "$BACKUP_PROOF_DIR"/*.sha256 \
            "$upload_dir/"
          echo "RESTORE_PROOF_UPLOAD_DIR=$upload_dir" >> "$GITHUB_ENV"

      - name: Upload trusted redacted restore proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-restore-proof-${{ github.run_id }}
          path: ${{ env.RESTORE_PROOF_UPLOAD_DIR }}
          retention-days: 90
          if-no-files-found: error
