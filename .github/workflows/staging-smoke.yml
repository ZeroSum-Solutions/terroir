name: Staging smoke

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      sha:
        description: Candidate SHA that Railway must be serving
        required: true
        type: string
      force_evidence_failure:
        description: Intentionally fail after Playwright to verify retained evidence
        required: false
        default: false
        type: boolean

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Required staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Confirm the deployed candidate on staging
        env:
          STAGING_EXPECTED_SHA: ${{ inputs.sha || github.sha }}
          STAGING_SMOKE_ATTEMPTS: "20"
        run: pnpm run test:staging

  isolated-e2e:
    name: Isolated E2E (parallel ${{ matrix.slot }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    env:
      CI: "1"
      TERROIR_E2E_ENABLED: "1"
      TERROIR_E2E_BASE_URL: https://terroir-web-staging.up.railway.app
      TERROIR_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
      TERROIR_E2E_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      TERROIR_E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      TERROIR_E2E_SUPABASE_PUBLISHABLE_KEY_SHA256: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY_SHA256 }}
      TERROIR_E2E_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      TERROIR_E2E_SERVICE_ROLE_KEY_SHA256: ${{ vars.STAGING_SUPABASE_SERVICE_ROLE_KEY_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the isolated authenticated workflow
        run: pnpm run test:e2e:isolated

      - name: Exercise the failure evidence path
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_evidence_failure }}
        run: |
          mkdir -p test-results/playwright
          printf '%s\n' 'Intentional staging evidence drill; no request or credential data captured.' > test-results/playwright/forced-evidence-drill.txt
          exit 1

      - name: Retain browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-e2e-${{ github.run_id }}-${{ matrix.slot }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: error
          retention-days: 14
