name: Staging smoke

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      sha:
        description: Candidate SHA that Railway must be serving
        required: true
        type: string
      force_evidence_failure:
        description: Intentionally fail after Playwright to verify retained evidence
        required: false
        default: false
        type: boolean

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Required staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Confirm the deployed candidate on staging
        env:
          STAGING_EXPECTED_SHA: ${{ inputs.sha || github.sha }}
          STAGING_SMOKE_ATTEMPTS: "20"
        run: pnpm run test:staging

  isolated-e2e:
    name: Isolated E2E (parallel ${{ matrix.slot }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    env:
      CI: "1"
      TERROIR_E2E_ENABLED: "1"
      TERROIR_E2E_BASE_URL: https://terroir-web-staging.up.railway.app
      TERROIR_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
      TERROIR_E2E_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      TERROIR_E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      TERROIR_E2E_SUPABASE_PUBLISHABLE_KEY_SHA256: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY_SHA256 }}
      TERROIR_E2E_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      TERROIR_E2E_SERVICE_ROLE_KEY_SHA256: ${{ vars.STAGING_SUPABASE_SERVICE_ROLE_KEY_SHA256 }}
      TERROIR_E2E_FORCE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_evidence_failure && '1' || '0' }}
      TERROIR_E2E_BROWSER_PATH: /usr/bin/google-chrome
      E2E_EVIDENCE_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify runner Chrome
        run: |
          test -x "$TERROIR_E2E_BROWSER_PATH"
          "$TERROIR_E2E_BROWSER_PATH" --version

      - name: Run the isolated authenticated workflow
        run: pnpm run test:e2e:isolated

      - name: Encrypt browser evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${E2E_EVIDENCE_AGE_RECIPIENT:-}" != age1* ]] ||
             [[ "$E2E_EVIDENCE_AGE_RECIPIENT" == *$'\n'* ]] ||
             [[ "$E2E_EVIDENCE_AGE_RECIPIENT" == *$'\r'* ]]; then
            echo "::error::BACKUP_AGE_RECIPIENT must be one age X25519 public recipient."
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          archive="$RUNNER_TEMP/isolated-e2e-${{ matrix.slot }}.tar.gz"
          encrypted="test-results/isolated-e2e-${{ matrix.slot }}.tar.gz.age"
          mkdir -p test-results
          tar -czf "$archive" playwright-report/ test-results/playwright/
          age -r "$E2E_EVIDENCE_AGE_RECIPIENT" -o "$encrypted" "$archive"
          rm -f "$archive"
          rm -rf playwright-report test-results/playwright

      - name: Retain browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-e2e-${{ github.run_id }}-${{ matrix.slot }}
          path: test-results/isolated-e2e-${{ matrix.slot }}.tar.gz.age
          if-no-files-found: error
          retention-days: 14
