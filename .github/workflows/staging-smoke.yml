name: Staging smoke

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      sha:
        description: Candidate SHA that Railway must be serving
        required: true
        type: string
      force_evidence_failure:
        description: Intentionally fail after Playwright to verify retained evidence
        required: false
        default: false
        type: boolean
      run_pdf_worker_pilot:
        description: Run the worker-backed PDF browser and 10-request load pilot
        required: false
        default: false
        type: boolean
      run_cellar_pilot:
        description: Run the isolated TER-025 cellar browser and database pilot
        required: false
        default: false
        type: boolean
      run_wine_intelligence_pilot:
        description: Run the isolated TER-026 wine-intelligence browser and database pilot
        required: false
        default: false
        type: boolean
      run_bottle_scan_pilot:
        description: Run the isolated TER-028 bottle-scan browser and database pilot
        required: false
        default: false
        type: boolean

concurrency:
  group: staging-smoke-staging
  cancel-in-progress: false

jobs:
  smoke:
    name: Required staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Confirm the deployed candidate on staging
        env:
          STAGING_EXPECTED_SHA: ${{ inputs.sha || github.sha }}
          STAGING_SMOKE_ATTEMPTS: "20"
        run: pnpm run test:staging

  isolated-e2e:
    name: Isolated E2E (parallel ${{ matrix.slot }})
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    env:
      CI: "1"
      TERROIR_E2E_ENABLED: "1"
      TERROIR_E2E_BASE_URL: https://terroir-web-staging.up.railway.app
      TERROIR_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slot }}
      TERROIR_E2E_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      TERROIR_E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      TERROIR_E2E_SUPABASE_PUBLISHABLE_KEY_SHA256: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY_SHA256 }}
      TERROIR_E2E_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      TERROIR_E2E_SERVICE_ROLE_KEY_SHA256: ${{ vars.STAGING_SUPABASE_SERVICE_ROLE_KEY_SHA256 }}
      TERROIR_E2E_FORCE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_evidence_failure && '1' || '0' }}
      TERROIR_E2E_BROWSER_PATH: /usr/bin/google-chrome
      E2E_EVIDENCE_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify runner Chrome
        run: |
          test -x "$TERROIR_E2E_BROWSER_PATH"
          "$TERROIR_E2E_BROWSER_PATH" --version

      - name: Install runner evidence helpers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age ffmpeg

      - name: Bind the runner video helper to Playwright
        shell: bash
        run: |
          set -euo pipefail
          system_ffmpeg="$(command -v ffmpeg)"
          test -x "$system_ffmpeg"
          revision="$(node -e 'const path = require("node:path"); const testPackage = require.resolve("@playwright/test/package.json"); const playwrightPackage = require.resolve("playwright/package.json", { paths: [path.dirname(testPackage)] }); const corePackage = require.resolve("playwright-core/package.json", { paths: [path.dirname(playwrightPackage)] }); const manifest = require(path.join(path.dirname(corePackage), "browsers.json")); const entry = manifest.browsers.find(({ name }) => name === "ffmpeg"); if (!entry?.revision) process.exit(1); process.stdout.write(entry.revision)')"
          playwright_ffmpeg="$HOME/.cache/ms-playwright/ffmpeg-$revision/ffmpeg-linux"
          mkdir -p "$(dirname "$playwright_ffmpeg")"
          ln -sfn "$system_ffmpeg" "$playwright_ffmpeg"
          "$playwright_ffmpeg" -version

      - name: Run the isolated authenticated workflow
        run: pnpm run test:e2e:isolated

      - name: Run the PDF worker browser and load pilot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pdf_worker_pilot && matrix.slot == 1 }}
        env:
          PDF_WORKER_E2E_ENABLED: "1"
        run: pnpm exec playwright test e2e/lists/pdf-worker.test.ts --workers=1

      - name: Run the isolated cellar pilot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cellar_pilot && matrix.slot == 1 }}
        env:
          CELLAR_E2E_ENABLED: "1"
        run: pnpm exec playwright test e2e/cellar-staging.test.ts --workers=1

      - name: Run the isolated wine-intelligence pilot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_wine_intelligence_pilot && matrix.slot == 1 }}
        env:
          WINE_INTELLIGENCE_E2E_ENABLED: "1"
        run: pnpm exec playwright test e2e/wine-intelligence-staging.test.ts --workers=1

      - name: Run the isolated bottle-scan pilot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_bottle_scan_pilot && matrix.slot == 1 }}
        env:
          BOTTLE_SCAN_E2E_ENABLED: "1"
        run: pnpm exec playwright test e2e/bottle-scan.test.ts --workers=1

      - name: Encrypt browser evidence
        id: encrypt_evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${E2E_EVIDENCE_AGE_RECIPIENT:-}" != age1* ]] ||
             [[ "$E2E_EVIDENCE_AGE_RECIPIENT" == *$'\n'* ]] ||
             [[ "$E2E_EVIDENCE_AGE_RECIPIENT" == *$'\r'* ]]; then
            echo "::error::BACKUP_AGE_RECIPIENT must be one age X25519 public recipient."
            exit 1
          fi
          archive="$RUNNER_TEMP/isolated-e2e-${{ matrix.slot }}.tar.gz"
          encrypted="test-results/isolated-e2e-${{ matrix.slot }}.tar.gz.age"
          mkdir -p test-results
          rm -f "$archive" "$encrypted" "$encrypted.sha256"
          evidence_paths=()
          if [[ -d playwright-report ]]; then
            evidence_paths+=(playwright-report/)
          fi
          if [[ -d test-results/playwright ]]; then
            evidence_paths+=(test-results/playwright/)
          fi
          if (( ${#evidence_paths[@]} == 0 )); then
            printf '%s\n' 'No browser evidence directory was produced before failure.' > test-results/no-browser-evidence.txt
            evidence_paths+=(test-results/no-browser-evidence.txt)
          fi
          tar -czf "$archive" "${evidence_paths[@]}"
          age -r "$E2E_EVIDENCE_AGE_RECIPIENT" -o "$encrypted" "$archive"
          test -s "$encrypted"
          head -n 1 "$encrypted" | grep -Fx 'age-encryption.org/v1'
          sha256sum "$encrypted" > "$encrypted.sha256"
          rm -f "$archive"
          rm -rf playwright-report test-results/playwright test-results/no-browser-evidence.txt

      - name: Retain browser failure evidence
        if: ${{ always() && steps.encrypt_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: isolated-e2e-${{ github.run_id }}-${{ matrix.slot }}
          path: |
            test-results/isolated-e2e-${{ matrix.slot }}.tar.gz.age
            test-results/isolated-e2e-${{ matrix.slot }}.tar.gz.age.sha256
          if-no-files-found: error
          retention-days: 14
