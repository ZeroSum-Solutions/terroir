# INT-018 — Railway PR preview health gate (staging Option B from
# docs/STAGING-SETUP.md).
#
# Triggers on PR. Binds Railway's authenticated PR comment to its
# deployment using the PR-specific environment ID and HEAD SHA, waits
# up to 5 minutes for success, then curls the comment's Railway-provided
# service domain at `/api/health` and fails the gate on non-200.
#
# The gate fails closed: missing PR metadata, a failed/error deployment,
# or exhaustion without a valid Railway preview all fail the job. A
# successful deployment passes only when its `/api/health` returns 200.
#
# SECURITY: this workflow intentionally avoids interpolating any
# untrusted PR-author-controlled strings (titles, bodies, branch
# names) in run: blocks. PR number and HEAD SHA are structured,
# GitHub-authored fields. Comment data is accepted only from the
# unique `railway-app[bot]` actor with type `Bot`, parsed as data, and
# constrained to a single `*.up.railway.app` HTTPS origin. User-authored
# comments and deployment status dashboard/log URLs are never curled.

name: Preview health

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Railway preview /api/health
    # Railway PR Environments are NOT provisioned (docs/STAGING-SETUP.md
    # §2026-08-22 re-verification: enabling them today would clone
    # production variables — an isolation hazard). The fail-closed poll
    # below is correct but has nothing to detect, so every PR showed a
    # permanently red check that trained everyone to ignore CI. Gate the
    # job behind an explicit repo variable: set RAILWAY_PR_PREVIEWS_ENABLED
    # to 'true' (Settings → Secrets and variables → Actions → Variables)
    # once an isolated preview base environment exists, and the fail-closed
    # gate arms again unchanged. Until then the check reports "skipped".
    if: ${{ vars.RAILWAY_PR_PREVIEWS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      deployments: read
      pull-requests: read

    steps:
      - name: Wait for Railway preview, then /api/health
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub-authored structured fields (integer + hash), not
          # writable by the PR author. `gh pr view` auto-detection
          # doesn't work reliably in detached-HEAD Actions checkout,
          # so we pass these explicitly.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          MAX_ATTEMPTS=20
          SLEEP_S=15

          if [ -z "$PR_NUMBER" ] || [ -z "$HEAD_SHA" ]; then
            echo "❌ Missing PR_NUMBER / HEAD_SHA — cannot validate the PR preview."
            exit 1
          fi
          # GITHUB_REPOSITORY is auto-provided by GitHub Actions.
          # Used instead of `gh repo view` so this job doesn't need
          # a checkout step (the workflow is a pure API poll).
          REPO="$GITHUB_REPOSITORY"

          echo "Polling for Railway preview on $REPO @ $HEAD_SHA ..."

          for i in $(seq 1 $MAX_ATTEMPTS); do
            comments_json=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
              2>/dev/null || echo '[]')
            railway_comment=$(printf '%s' "$comments_json" | jq -r '
              [.[] | select(
                .user.login == "railway-app[bot]" and
                .user.type == "Bot" and
                (.body | startswith("<!-- railway-bot-comment-version="))
              )] | last | .body // empty
            ')
            environment_id=$(printf '%s' "$railway_comment" | jq -Rrs '
              try capture("environmentId=(?<id>[0-9a-fA-F-]{36})").id catch ""
            ')
            preview_url=$(printf '%s' "$railway_comment" | jq -Rrs '
              [scan("https://[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)*\\.up\\.railway\\.app")]
              | unique
              | if length == 1 then .[0] else empty end
            ')

            deployments_json=$(gh api "repos/$REPO/deployments?sha=$HEAD_SHA&per_page=100" \
              2>/dev/null || echo '[]')
            deployment_id=$(printf '%s' "$deployments_json" | jq -r \
              --arg environment_id "$environment_id" \
              --arg head_sha "$HEAD_SHA" '
                [.[] | select(
                  .creator.login == "railway-app[bot]" and
                  .creator.type == "Bot" and
                  .sha == $head_sha and
                  .payload.environmentId == $environment_id
                )]
                | sort_by(.created_at)
                | last
                | .id // empty
              ')

            if [ -n "$deployment_id" ]; then
              statuses_json=$(gh api "repos/$REPO/deployments/$deployment_id/statuses" \
                2>/dev/null || echo '[]')
              state=$(printf '%s' "$statuses_json" | jq -r '.[0].state // empty')

              if [ "$state" = "success" ] && [ -n "$preview_url" ]; then
                health_url="${preview_url%/}/api/health"
                echo "Preview ready — curling $health_url"
                http_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$health_url" || echo "000")
                if [ "$http_code" = "200" ]; then
                  echo "✅ Preview /api/health returned 200"
                  exit 0
                fi
                echo "❌ Preview /api/health returned $http_code (expected 200)"
                exit 1
              fi

              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "❌ Railway deployment state=$state"
                exit 1
              fi
            fi

            echo "Attempt $i/$MAX_ATTEMPTS — no ready preview yet, sleeping ${SLEEP_S}s..."
            sleep $SLEEP_S
          done

          echo "❌ No valid Railway preview detected within $((MAX_ATTEMPTS * SLEEP_S))s."
          echo "    Confirm Railway PR Previews are enabled."
          echo "    See docs/STAGING-SETUP.md → Option B."
          exit 1
