# TER-022 deterministic scanner score.
#
# This workflow is intentionally non-billed: it reads only committed synthetic
# fixtures and must never receive provider credentials. A real-provider canary
# remains a separate, owner-approved release activity because it incurs cost and
# requires consent-safe provider inputs.

name: Score scanner fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    name: Enforce scanner release floors
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Score synthetic fixtures
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/score-scanner-fixtures.ts | tee scanner-score.json

      - name: Upload scoring evidence
        uses: actions/upload-artifact@v4
        with:
          name: scanner-fixture-score-${{ github.sha }}
          path: scanner-score.json
          if-no-files-found: error
          retention-days: 30
