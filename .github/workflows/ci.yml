# BND-012 / INT-003 / INT-006
#
# Minimum-viable CI for Terroir. Gates every PR on these checks:
#   1. feature ledger verification (authoritative completion contract)
#   2. typecheck    (tsc --noEmit)
#   3. lint         (next lint / eslint)
#   4. unit tests   (vitest run)
#   5. contract tests (DB security/API envelopes)
#   6. schema drift (supabase/schema.snapshot.sql must equal a fresh
#                    concatenation of supabase/migrations/*.sql)
#   7. types drift  (src/types/database.ts must equal the live schema's
#                    current generated types) — skipped when
#                    SUPABASE_ACCESS_TOKEN is not set (fork PRs etc.)
#   8. downs check  (every forward migration from 0011 onward has a
#                    paired supabase/migrations/down/*.down.sql file —
#                    INT-006)
#   9. local seed dry-run (sanitized production-like fixtures still build)
#
# The schema-drift step turns "someone added a migration but forgot to
# update the snapshot" into a hard failure. To regenerate the snapshot
# locally: `pnpm run snapshot` (defined in package.json) then commit the
# regenerated file.
#
# Types-drift requires two repo secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token, scope `read:projects`
#   SUPABASE_PROJECT_ID    project ref (~20-char id from project URL)
# Regenerate locally with `pnpm run types:gen` and commit the diff.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck / Lint / Test / Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Surface secrets to env at job level so a later step's `if:` can
      # test them. Empty string when the secret isn't configured.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Feature ledger verification
        run: pnpm verify:feature-ledger

      - name: API contract verification
        run: pnpm run verify:api-contract

      - name: Product contract conformance
        run: pnpm run verify:product-conformance

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Contract tests
        run: pnpm run test:contracts

      - name: Schema drift check
        # Regenerate the snapshot and diff against the committed one.
        # Any change means a migration was added without running
        # `pnpm run snapshot` locally — fail loudly.
        run: pnpm run snapshot:check

      - name: Types drift check
        # Regenerate database.ts from the live schema and fail if it
        # differs from the committed file. Skipped silently when the
        # secret isn't configured — the check still runs for members
        # but doesn't block fork PRs that can't access secrets.
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: pnpm run types:check

      - name: Down migrations check
        # INT-006 — every forward migration from 0011 onward must have a
        # paired .down.sql sibling. Catches PRs that add a forward
        # migration without writing its rollback.
        run: pnpm run downs:check

      - name: Local Supabase seed dry-run
        # Builds sanitized, production-like fixture data and prints counts.
        # No database writes happen without --confirm.
        run: pnpm run supabase:seed:local
