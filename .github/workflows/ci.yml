# BND-012 / INT-003 / INT-006
#
# Minimum-viable CI for Terroir. Gates every PR on these checks:
#   1. feature ledger verification (authoritative completion contract)
#   2. VWP eval traceability (schema, PRD map, executable eval references)
#   3. API contract parity (route inventory matches current source)
#   4. product conformance drift (classifications match current source)
#   5. typecheck    (tsc --noEmit)
#   6. lint         (next lint / eslint)
#   7. unit tests   (vitest run)
#   8. build        (next build — catches build-only failures tsc/lint/tests
#                    miss, e.g. invalid route segment config)
#   9. contract tests (DB security/API envelopes)
#  10. schema drift (supabase/schema.snapshot.sql must equal a fresh
#                    concatenation of supabase/migrations/*.sql)
#  11. types drift  (src/types/database.ts must equal the live schema's
#                    current generated types) — skipped when
#                    SUPABASE_ACCESS_TOKEN is not set (fork PRs etc.)
#  12. downs check  (every forward migration from 0011 onward has a
#                    paired supabase/migrations/down/*.down.sql file —
#                    INT-006)
#  13. local seed dry-run (sanitized production-like fixtures still build)
#  14. E2E critical journeys (G1-8) — scan→commit, list publish, pour, run
#                    headless against a real, disposable local Supabase
#                    (supabase start + every migration + the same seed
#                    fixtures as step 12, applied for real this time).
#                    Screenshots/traces upload as job artifacts on failure.
#
# The schema-drift step turns "someone added a migration but forgot to
# update the snapshot" into a hard failure. To regenerate the snapshot
# locally: `pnpm run snapshot` (defined in package.json) then commit the
# regenerated file.
#
# Types-drift requires two repo secrets:
#   SUPABASE_ACCESS_TOKEN  personal access token, scope `read:projects`
#   SUPABASE_PROJECT_ID    project ref (~20-char id from project URL)
# Regenerate locally with `pnpm run types:gen` and commit the diff.

name: CI

on:
  # Deliberately unfiltered by base branch. `pull_request: branches: [main]`
  # filters on the BASE, so a stacked PR (one feature branch based on another)
  # silently got NO CI at all — not a skip, not a failure, an empty check list.
  # That is the worst possible failure mode for a merge gate, and it bit
  # PR #153. During the modular refactor many branches are in flight at once,
  # so every PR is gated regardless of what it targets.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck / Lint / Test / Schema
    # Blacksmith runner (their ubuntu-latest equivalent at 4 vCPU, matching
    # GitHub's hosted core count on faster hardware). This job is the
    # docker-heavy one — Supabase image pulls, Playwright install, full
    # vitest + E2E — and the only gating check, so it moves first; the other
    # workflows stay on GitHub-hosted until this proves out. Baseline before
    # the switch: 10m18s on ubuntu-latest (PR #170).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # 10 min covered the original checks; local Supabase start (docker image
    # pulls) + Playwright browser install + the E2E run add real time on a
    # cold runner, so this needs more headroom than before.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Feature ledger verification
        run: pnpm verify:feature-ledger

      - name: VWP eval traceability
        run: pnpm run eval:vwp

      - name: API contract verification
        run: pnpm run verify:api-contract

      - name: Product contract conformance
        run: pnpm run verify:product-conformance

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 (v1.7.1)
        with:
          version: 2.109.1

      - name: Start local Supabase
        # supabase/config.toml is committed since the 2026-08-24 integration
        # (573xx ports, terroir-vw-local project id — see
        # docs/runbooks/local-stack.md); `init` is only a fallback for a
        # tree without one. `start` applies every file in
        # supabase/migrations/ into a fresh Postgres + PostgREST + GoTrue
        # stack that lives only for this job — not a shared database.
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --with-vscode-settings=false --with-intellij-settings=false
          fi
          supabase start

      - name: Export local Supabase env for tests and E2E
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            2>/dev/null \
            | grep -E '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            | tr -d '"' >> "$GITHUB_ENV"
          # Must match Playwright's baseURL (playwright.config.ts) exactly —
          # the app derives every auth redirect from this origin rather than
          # trusting the request Host (docs/AUTH-SETUP.md), so a mismatch
          # against the host tests actually navigate to drops session
          # cookies across the redirect.
          # Mailpit endpoint for the password-recovery E2E — from the same
          # status call, so it always matches the running stack's port.
          supabase status -o env 2>/dev/null \
            | grep -E '^(MAILPIT_URL|INBUCKET_URL)=' | head -1 \
            | sed 's/^[A-Z_]*=/E2E_MAILBOX_URL=/' | tr -d '"' >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "ACTIVE_RESTAURANT_COOKIE_SECRET=ci-e2e-cookie-secret-not-sensitive" >> "$GITHUB_ENV"
          echo "DEV_BYPASS_EMAIL=owner+local@terroir.test" >> "$GITHUB_ENV"

      - name: Seed local Supabase for tests and E2E
        run: pnpm run supabase:seed:local:apply


      - name: Test
        # Runs AFTER the local Supabase stack is up and its env exported
        # (integration critic finding, 2026-08-24): the MANDATORY live-DB
        # suites (P2 cross-tenant containment, merge_wines repointing, P3
        # chunked import) previously skipped silently in CI because this
        # step had no stack. They now run for real, and each suite throws
        # outright if the env is missing while CI=true instead of skipping.
        # Runs with --coverage (same full suite, instrumented) rather than
        # a separate step, so the reconcile-ledger/cellar/pours coverage
        # gate (vitest.config.ts) rides along instead of re-running the
        # whole suite a second time.
        run: pnpm run coverage

      - name: Build
        # Catches build-only failures that typecheck/lint/tests don't:
        # tsc accepts things `next build` rejects (e.g. invalid route
        # segment config, bad dynamic imports). No env vars are required —
        # verified locally that main builds clean with none set.
        run: pnpm run build

      - name: Contract tests
        run: pnpm run test:contracts

      - name: Schema drift check
        # Regenerate the snapshot and diff against the committed one.
        # Any change means a migration was added without running
        # `pnpm run snapshot` locally — fail loudly.
        run: pnpm run snapshot:check

      - name: Types drift check
        # Compare database.ts with the schema produced by this checkout's
        # migrations. Comparing against the hosted project rejects migration
        # PRs until those same migrations are deployed, reversing the order CI
        # is supposed to enforce.
        run: pnpm run types:check:local

      - name: Design system check
        # DESIGN.md is the contract, and a contract nobody can run is a
        # preference. Four gates: the brown/cream ban, every measured contrast
        # pair, DESIGN.md <-> globals.css token agreement, and the type scale's
        # fingerprinted baseline (new arbitrary sizes fail; the baseline only
        # shrinks).
        run: pnpm run check:design

      - name: File-size ratchet
        # "No monoliths" was a stated rule with nothing enforcing it: 62 files
        # in src/ were over budget and one is 3,149. Those are frozen in
        # scripts/file-size-baseline.json — a baselined file may shrink but
        # never grow, and a new file may not cross the budget at all. Pay the
        # debt down with `pnpm check:file-size:update` after splitting.
        # Two budgets: 400 lines for application code, 1000 for a vitest suite,
        # because a long table-driven suite is cases, not a tangled module.
        run: pnpm run check:file-size

      - name: Control-row ratchet
        # GLOBAL-01 — "if you cannot fit all the buttons horizontally in one
        # frame, then there are too many buttons." Its own step rather than a
        # fifth gate inside check:design, because that chain is the token
        # contract (palette, contrast, token-sync, type scale) and this is a
        # layout rule; a separate step also names it in the CI log. Routes over
        # one row are frozen in scripts/check-control-rows-baseline.json — a
        # baselined route may shrink but never grow, and a route not in it may
        # not cross the budget at all. Re-record with
        # `pnpm check:control-rows:update` after consolidating.
        run: pnpm run check:control-rows

      - name: Down migrations check
        # INT-006 — every forward migration from 0011 onward must have a
        # paired .down.sql sibling. Catches PRs that add a forward
        # migration without writing its rollback.
        run: pnpm run downs:check

      - name: Migration manifest check
        run: pnpm run manifest:check

      - name: Local Supabase seed dry-run
        # Builds sanitized, production-like fixture data and prints counts.
        # No database writes happen without --confirm.
        run: pnpm run supabase:seed:local

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E — critical journeys (scan→commit, list publish, pour)
        # playwright.config.ts's webServer starts `pnpm dev` itself and
        # waits for port 3000. That has to be dev mode, not a production
        # build/start: /api/dev-login hard-404s whenever NODE_ENV=production,
        # unconditionally and by design (docs/BREAK-GLASS.md) — there is no
        # env var that reopens it, so E2E can only drive auth through dev
        # mode's bypass.
        run: pnpm exec playwright test e2e/demo-critical-journeys.test.ts e2e/pour-flow.test.ts

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
